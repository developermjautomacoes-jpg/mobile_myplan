openapi: 3.1.0
info:
  title: myplan API
  description: |
    Sua vida. Seus planos. Sempre em foco.

    API de tarefas pessoais do myplan.

    **Versões**
    - **v2** (atual): `/api/v2/tarefas`
    - **v1** (depreciada, funciona até 30/06/2027): `/api/v1/tarefas`

    Escolha a versão no seletor "Select a definition", no topo da página.

    **Início rápido**
    1. Crie uma tarefa: `POST /api/v2/tarefas` com `{"titulo": "Pagar conta de luz"}`
    2. Liste: `GET /api/v2/tarefas`
    3. Conclua: `PATCH /api/v2/tarefas/1/status` com `{"status": "CONCLUIDA"}`

    **Erros** seguem o formato Problem Details (RFC 9457), com `codigo` e `dica` de como corrigir.
  contact:
    name: Monique Coelho
  version: 3.0.0
externalDocs:
  description: README e catálogo de erros no GitHub
  url: https://github.com/developermjautomacoes-jpg/mobile_myplan/tree/main/api
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Versões
  description: Versões disponíveis da API
- name: Tarefas v1
  description: "Versão antiga, mantida por compatibilidade. Use a v2 em projetos novos."
paths:
  /api/v1/tarefas/{id}:
    get:
      tags:
      - Tarefas v1
      summary: Busca uma tarefa
      operationId: buscar
      parameters:
      - name: id
        in: path
        description: Id da tarefa
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
        example: 1
      responses:
        "200":
          description: Tarefa encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TarefaResponseV1"
        "404":
          description: Tarefa não existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                TarefaNaoEncontrada:
                  $ref: "#/components/examples/TarefaNaoEncontrada"
      deprecated: true
    put:
      tags:
      - Tarefas v1
      summary: Atualiza uma tarefa
      operationId: atualizar
      parameters:
      - name: id
        in: path
        description: Id da tarefa
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TarefaRequestV1"
        required: true
      responses:
        "200":
          description: Tarefa atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TarefaResponseV1"
        "400":
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
        "404":
          description: Tarefa não existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
      deprecated: true
    delete:
      tags:
      - Tarefas v1
      summary: Exclui uma tarefa
      operationId: excluir
      parameters:
      - name: id
        in: path
        description: Id da tarefa
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
        example: 1
      responses:
        "204":
          description: Tarefa excluída
        "404":
          description: Tarefa não existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
      deprecated: true
  /api/v1/tarefas:
    get:
      tags:
      - Tarefas v1
      summary: Lista todas as tarefas
      description: "Devolve todas as tarefas numa lista simples, ordenadas pelo id.\
        \ Na v2 a lista é paginada."
      operationId: listar
      parameters:
      - name: status
        in: query
        description: Filtra pelo status
        required: false
        schema:
          type: string
          enum:
          - PENDENTE
          - EM_ANDAMENTO
          - CONCLUIDA
      responses:
        "200":
          description: Lista de tarefas (pode vir vazia)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TarefaResponseV1"
        "400":
          description: Status inválido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
      deprecated: true
    post:
      tags:
      - Tarefas v1
      summary: Cria uma tarefa
      operationId: criar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TarefaRequestV1"
        required: true
      responses:
        "201":
          description: Tarefa criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TarefaResponseV1"
        "400":
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                DadosInvalidos:
                  $ref: "#/components/examples/DadosInvalidos"
        "409":
          description: Título repetido em tarefa aberta
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
        "422":
          description: Prazo no passado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
      deprecated: true
  /api:
    get:
      tags:
      - Versões
      summary: Lista as versões da API
      operationId: versoes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Versao"
components:
  schemas:
    TarefaRequestV1:
      type: object
      description: Dados para criar ou atualizar uma tarefa (v1)
      properties:
        titulo:
          type: string
          example: Pagar conta de luz
          maxLength: 100
          minLength: 0
          pattern: "^[^<>]*$"
        descricao:
          type: string
          example: Vence no dia 10
          maxLength: 500
          minLength: 0
          pattern: "^[^<>]*$"
        status:
          type: string
          enum:
          - PENDENTE
          - EM_ANDAMENTO
          - CONCLUIDA
          example: PENDENTE
        prazo:
          type: string
          format: date
          example: 2026-12-10
      required:
      - titulo
    ErroResponse:
      type: object
      description: "Erro no formato Problem Details (RFC 9457), com campos extras\
        \ do myplan"
      properties:
        type:
          type: string
          description: Link para a explicação do erro no catálogo
          example: https://github.com/developermjautomacoes-jpg/mobile_myplan/blob/main/api/docs/erros.md#tarefa-nao-encontrada
        title:
          type: string
          description: Resumo do erro
          example: Tarefa não encontrada
        status:
          type: integer
          format: int32
          description: Status HTTP
          example: 404
        detail:
          type: string
          description: O que aconteceu nesta requisição
          example: Não existe tarefa com o id 99
        instance:
          type: string
          description: Endereço chamado
          example: /api/v2/tarefas/99
        codigo:
          type: string
          description: "Código do erro, para o cliente tratar cada caso"
          example: TAREFA_NAO_ENCONTRADA
        dica:
          type: string
          description: Como resolver
          example: "Confira o id. Para ver os ids existentes, liste as tarefas em\
            \ GET /api/v2/tarefas."
        campos:
          type: object
          additionalProperties:
            type: string
          description: "Erros por campo, quando houver"
        requestId:
          type: string
          description: "Id da requisição, o mesmo do header X-Request-Id"
        timestamp:
          type: string
          format: date-time
    TarefaResponseV1:
      type: object
      description: Tarefa no formato da v1 (o mesmo da primeira versão da API)
      properties:
        id:
          type: integer
          format: int64
          example: 1
        titulo:
          type: string
          example: Pagar conta de luz
        descricao:
          type: string
          example: Vence no dia 10
        status:
          type: string
          enum:
          - PENDENTE
          - EM_ANDAMENTO
          - CONCLUIDA
          example: PENDENTE
        prazo:
          type: string
          format: date
          example: 2026-12-10
        dataCriacao:
          type: string
          format: date-time
          example: 2026-11-20T22:10:32
        dataAtualizacao:
          type: string
          format: date-time
          example: 2026-11-21T09:15:00
    Versao:
      type: object
      description: Versão da API
      properties:
        versao:
          type: string
          example: v2
        endereco:
          type: string
          example: /api/v2/tarefas
        situacao:
          type: string
          example: ATUAL
        fimDoSuporte:
          type: string
          description: "Data em que a versão deixa de funcionar, quando houver"
        novidades:
          type: string
          example: "Paginação, filtros, ordenação, PATCH de status e resumo"
  examples:
    TarefaNaoEncontrada:
      summary: Id que não existe
      value:
        type: https://github.com/developermjautomacoes-jpg/mobile_myplan/blob/main/api/docs/erros.md#tarefa-nao-encontrada
        title: Tarefa não encontrada
        status: 404
        detail: Não existe tarefa com o id 99
        instance: /api/v2/tarefas/99
        codigo: TAREFA_NAO_ENCONTRADA
        dica: "Confira o id. Para ver os ids existentes, liste as tarefas em GET /api/v2/tarefas."
        requestId: 3f2a9c1e-7b4d-4e8a-9f10-2c6d8e5a1b7f
    DadosInvalidos:
      summary: Campos fora das regras
      value:
        type: https://github.com/developermjautomacoes-jpg/mobile_myplan/blob/main/api/docs/erros.md#dados-invalidos
        title: Dados inválidos
        status: 400
        detail: 2 campos estão inválidos
        instance: /api/v2/tarefas
        codigo: DADOS_INVALIDOS
        dica: Corrija os campos listados em 'campos' e envie de novo.
        campos:
          titulo: O título deve ter entre 3 e 100 caracteres
          descricao: A descrição não pode conter os caracteres < ou >
    TarefaDuplicada:
      summary: Título repetido
      value:
        type: https://github.com/developermjautomacoes-jpg/mobile_myplan/blob/main/api/docs/erros.md#tarefa-duplicada
        title: Tarefa duplicada
        status: 409
        detail: Já existe uma tarefa em aberto com o título 'Pagar conta de luz'
        instance: /api/v2/tarefas
        codigo: TAREFA_DUPLICADA
        dica: Use outro título ou conclua a tarefa que já existe com esse nome.
    RegraDeNegocio:
      summary: Prazo no passado
      value:
        type: https://github.com/developermjautomacoes-jpg/mobile_myplan/blob/main/api/docs/erros.md#regra-de-negocio
        title: Operação não permitida
        status: 422
        detail: O prazo 2026-11-19 já passou. Informe a data de hoje ou uma data futura
        instance: /api/v2/tarefas
        codigo: REGRA_DE_NEGOCIO
        dica: "Os dados estão no formato certo, mas violam uma regra do myplan. Leia\
          \ o 'detalhe'."
    ParametroInvalido:
      summary: Tamanho de página acima do limite
      value:
        type: https://github.com/developermjautomacoes-jpg/mobile_myplan/blob/main/api/docs/erros.md#parametro-invalido
        title: Parâmetro inválido
        status: 400
        detail: Um ou mais parâmetros da URL estão inválidos
        instance: /api/v2/tarefas
        codigo: PARAMETRO_INVALIDO
        dica: Confira os parâmetros da URL na documentação do endpoint.
        campos:
          tamanho: O tamanho máximo é 50
    TipoDeConteudoInvalido:
      summary: Corpo enviado como texto
      value:
        type: https://github.com/developermjautomacoes-jpg/mobile_myplan/blob/main/api/docs/erros.md#tipo-de-conteudo-invalido
        title: Tipo de conteúdo não suportado
        status: 415
        detail: "O Content-Type recebido foi 'text/plain', mas este endpoint só aceita\
          \ application/json"
        instance: /api/v2/tarefas
        codigo: TIPO_DE_CONTEUDO_INVALIDO
        dica: "Envie o corpo em JSON com o header 'Content-Type: application/json'."
